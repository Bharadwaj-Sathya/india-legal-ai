services:
  backend:
    build: ./indian-legal-ai-backend
    container_name: indian_legal_ai_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    env_file:
      - ./backend/.env

  frontend:
    image: node:24
    container_name: indian_legal_ai_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    expose:
      - "5173"
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    env_file:
      - ./frontend/.env
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: indian_legal_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_node_modules: